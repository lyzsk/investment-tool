<script>
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");}
function md(t){ // 极简 markdown: 代码块 / 表格 / 标题 / 列表 / 引用 / 粗体
 const out=[];const L=String(t||"").split("\n");let i=0;
 while(i<L.length){const l=L[i];
  if(l.startsWith("```")){const b=[];i++;while(i<L.length&&!L[i].startsWith("```"))b.push(L[i++]);i++;out.push("<pre>"+esc(b.join("\n"))+"</pre>");continue;}
  if(/^\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\|[-:| ]+\|\s*$/.test(L[i+1])){const row=x=>x.trim().replace(/^\||\|$/g,"").split("|").map(c=>inl(c.trim()));
   let h="<table><tr>"+row(l).map(c=>"<th>"+c+"</th>").join("")+"</tr>";i+=2;while(i<L.length&&/^\|/.test(L[i])){h+="<tr>"+row(L[i]).map(c=>"<td>"+c+"</td>").join("")+"</tr>";i++;}out.push(h+"</table>");continue;}
  const m=l.match(/^(#{1,4}) (.*)/);if(m){const n=Math.min(6,m[1].length+2);out.push(`<h${n}>${inl(m[2])}</h${n}>`);i++;continue;}
  if(/^\s*[-*] /.test(l)){out.push("<div style='padding-left:"+(l.search(/\S/)*8+8)+"px'>• "+inl(l.replace(/^\s*[-*] /,""))+"</div>");i++;continue;}
  if(l.startsWith(">")){out.push("<div class='k'>"+inl(l.replace(/^>\s?/,""))+"</div>");i++;continue;}
  out.push(l.trim()?"<div>"+inl(l)+"</div>":"<div style='height:6px'></div>");i++;}
 return out.join("");}

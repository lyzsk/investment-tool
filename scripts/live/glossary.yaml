# glossary.yaml — 实盘线 / paper v3 术语表(10/24 用户令: 用 harness 统一对话口径; 只放这里定义过的词, 不自造同义词)
# 用途: ①拼进所有会话共用的系统提示(scripts/paper_line/session.py → 全部会话一样, 吃缓存) ②harness 术语闸(harness.gate_terms): 模型输出里出现 ban 里的词 / 股票简称 → 记一条(指引模式, 不打回)
# 字段: def = 定义; mech = 代码怎么判 / 数据里的标签在哪(没有 = 只是口径); ban = 禁用的同义词 / 旧叫法
# 标 👤待你定 的是我按代码现状写的, 等你改
version: 1
updated: 2026-10-26

rules:
  - "股票 / 转债 / ETF 名一律用全称(证券库 security_master 的名称), 第一次出现带 6 位代码: 北新路桥(002307), 不写北新 / 阿慈 / 宁王; 昵称表 scripts/live/stock_aliases.json"
  - "涨跌幅一律带正负号和 %(+2.35% / −1.20%); \"个点\" 只用于指数 / 两个百分比之差"
  - "时刻写 HH:MM(秒级写 HH:MM:SS); 日期写 MM-DD 或 YYYY-MM-DD"
  - "概率 / 统计必须写样本数 n 和出处编号(E / Q / M); 只写中位不算数(要同时写最差或 P10)"
  - "(10/25) 统计看条件: 只按昨天状态算的今天分布(炸板回封 / 强势股次日 …)是先验; 用到今天盘中已发生情况的(必查「封板状态」/ 触及概率 / 反抽强弱 …)更具体, 两者冲突时以更具体的为准; 今天的事件之后的「次日」统计(电报点名后次日 …)只用于要不要拿过夜"

terms:
  # ---------------- 板型(10/22 用户亲定; 代码: scripts/test/board_knowledge.py 的 typ, 事件本体 open / day 事件) ----------------
  - {term: "一字板", def: "开盘即涨停封死(开 = 高 = 低 = 涨停价); 必须看有没有漏单", mech: "日线 open=high=low=涨停价; 漏单 = 封死期间有成交", ban: ["一字"]}
  - {term: "漏单", def: "一字封死期间仍有成交(排队的人买到了); 漏多少要和封单量比", mech: "一字日成交量 / 3 秒盘口封单"}
  - {term: "T字板", def: "一字开板后迅速回封(例 星光股份 10-22 09:40 开板 09:41 回封)", mech: "board_knowledge typ=T字", ban: ["T板", "T型板"]}
  - {term: "回封板", def: "盘中开板 1 次后重新封住", mech: "board_knowledge typ=回封(开 1 次)"}
  - {term: "烂板回封", def: "开板 ≥2 次, 最后封住", mech: "board_knowledge typ=烂板回封(开 ≥2 次)"}
  - {term: "烂板", def: "(10/24 用户定) 反复开板、回封尝试 n 次, 收盘最终还是没封住涨停 —— 和烂板回封相反, 不是一回事; 属于炸板的一种", mech: "代码还没单独标: 先按 事件本体 open 事件 ≥2 次 且收盘不在涨停价 判"}
  - {term: "厂字板", def: "开盘不管高开低开一路拉到涨停, 封住不再开; 强势板, 不是失败板", mech: "board_knowledge typ=厂字(一路拉板)"}
  - {term: "炸板", def: "当天封过涨停、收盘没封住(炸板不回封); 按首封时刻分 早盘炸板(首封 <10:30) / 盘中炸板 / 尾盘炸板(首封 ≥14:00)", mech: "board_knowledge typ=炸板不回封·早盘/盘中/尾盘; 强势股库 state=炸板", ban: ["破板"]}
  - {term: "开板", def: "封住涨停后有卖单成交、价格离开涨停价(之后可能回封也可能炸板)", mech: "事件本体 open 事件(深度 / 时长 / 时段 / 第几次)"}
  - {term: "天地板", def: "涨停 → 跌停(中间触及也算)", mech: "board_knowledge typ=天地"}
  - {term: "地天板", def: "跌停 → 涨停(中间触及也算)", mech: "board_knowledge typ=地天"}
  - {term: "天地天板", def: "涨停 → 跌停 → 涨停(触及也算)", mech: "board_knowledge typ=天地天"}
  - {term: "地天地板", def: "跌停 → 涨停 → 跌停(触及也算)", mech: "board_knowledge typ=地天地"}
  - {term: "13 档", def: "(10/27 用户定) md 午评 / 收评里的涨跌分析档位, 从涨停到跌停一共 13 档: 涨停 / >8 / 6~8 / 4~6 / 2~4 / 0~2 / 平(±0.2%) / −2~0 / −4~−2 / −6~−4 / −8~−6 / <−8 / 跌停(单位 %, 每档 2 个点); 用户说「13 档的 2 个点内」= 落在 0~2 档, 「4 个点内」= 2~4 档, 「水上的 3 档」= 涨停以下的 >8 / 6~8 / 4~6; 20cm / 30cm 股票(10/27 晚用户定): ±8% 以内同主板, 往外每档仍 2 个点对称外延到涨跌停(8~10 / 10~12 / … / >18 / −10~−8 / … / <−18); 转债 ±20% 仍是档距 ×2(每档 4 个点)", mech: "skills_ver/open_bins.py / market/similar_days.b13(开盘档同口径)"}
  - {term: "首板", def: "前一天没涨停、今天收盘封住涨停", mech: "强势股库 state=首板"}
  - {term: "N连板", def: "连续 N 个交易日收盘涨停(二板 / 三板…)", mech: "强势股库 state=二板 / 三板+; 财联社涨停池 limit_up_days", ban: ["N板连板"]}
  - {term: "续板", def: "昨天涨停、今天继续收盘涨停", mech: "collect_mood / must_extra.market_ctx 的 xb"}
  - {term: "断板", def: "昨天涨停、今天收盘没涨停", mech: "market_ctx 的 db; 强势股库 state=回调1"}
  - {term: "晋级率", def: "今天续板家数 ÷ 昨天涨停家数", mech: "market_ctx 的 jj(%)"}
  - {term: "封板率", def: "涨停家数 ÷ (涨停 + 炸板)", mech: "collect_mood 的 seal"}
  - {term: "炸板率", def: "炸板家数 ÷ (涨停 + 炸板) = 100% − 封板率", mech: "collect_mood / market_ctx 的 zbr"}
  - {term: "首封时刻", def: "当天第一次封住涨停的时刻", mech: "财联社涨停池 time; 分钟路径"}
  - {term: "封单", def: "涨停价上排队的买单量", mech: "3 秒盘口买一量(涨停时)"}
  - {term: "涨停回调", def: "涨停后的第 1 / 2 / 3 个交易日没再涨停的回落阶段(回调1 / 回调2 / 回调3)", mech: "强势股库 state=回调1~3"}
  # ---------------- 打法(导师指纹的打法标签; 代码: scripts/tzzb/mentor_fingerprint.py) ----------------
  - {term: "打板", def: "在涨停价(或即将封板时)买入", mech: "买价 ≈ 涨停价"}
  - {term: "排板", def: "涨停已封住时在涨停价挂买单排队", mech: "一字 / 封死时挂涨停价买单"}
  - {term: "半路", def: "涨到 +5% 左右(未封板)追买", mech: "买时涨幅 5%~9%(主板)"}
  - {term: "低吸", def: "盘中回落时买入(相对当日高点或均价线下方)"}
  - {term: "首板次日", def: "买入的票前一天是首板", mech: "指纹打法标签 首板次日"}
  - {term: "连板接力", def: "买入的票前一天是 ≥2 连板", mech: "指纹打法标签 连板接力"}
  - {term: "炸板低吸", def: "炸板后在开板回落中买入(刘忆青 10-15 百洋股份 5 板炸板中逐级低吸)"}
  # ---------------- 做 T(用户做 T 纪律: 参数按个股近 30 日振幅分布定) ----------------
  - {term: "底仓", def: "做 T 时一直持有、不打算当天全部卖掉的那部分"}
  - {term: "正T", def: "先买后卖(当天低位加、高位卖回原股数)", ban: ["顺T"]}
  - {term: "反T", def: "先卖后买(当天高位卖、低位接回原股数)", ban: ["倒T"]}
  - {term: "隔夜正T", def: "今天低吸多出来的部分过夜, 次日冲高卖"}
  - {term: "隔夜反T", def: "今天卖了没接回, 几天内低位接回"}
  - {term: "时间止损", def: "到某个时刻还没达到预期(价格 / 走势)就卖", mech: "06 wake 的 type=time"}
  - {term: "破位", def: "价格跌破 06 / 计划里写明的关键价位", mech: "06 wake 的 type=price op=<="}
  - {term: "盘前首跑", def: "(10/24 用户定) 每条线当天第一次跑 chain(盘前, 08:35 起串行); 它的第 1 条消息 = 盘前首跑材料(E 编号全天固定, 盘中触发只重发随价格变的项)", mech: "executor 开盘前首版 / pack.boot_msg", ban: ["开机"]}
  # ---------------- 价位 / 走势 ----------------
  - {term: "关键价位", def: "涨跌停价 / 前高前低 / 均线 / 缺口 / 涨停板位 / 成交密集区 / 整数关口 / 分时均价", mech: "./q levels; 必查 关键价位"}
  - {term: "箱体上沿", def: "(10/24 用户认可牧原股份示意图) 段式箱体: 价格横盘 ≥8 根起箱, 上沿 = 箱内 K 线实体顶的 90% 分位(去单根长上影), 宽度 1.5~8 ATR; 收盘越出上沿 0.5 ATR 连续 >2 根才算离箱, 1~2 根就收回 = 假突破; 级别: 日线 / 1 / 5 / 15 / 30 / 60 / 120 分钟(10/25 用户定), 引用必须写级别(例 日线箱体上沿 43.22); 宽度和离箱阈值都按 ATR(摆动点 + ATR 口径)", mech: "scripts/paper_line/tools/kline_struct.py(必查 K线结构: 日线 + 15 分钟)· scripts/kline_study/draw_box.py(画图)"}
  - {term: "箱体下沿", def: "同箱体上沿: 下沿 = 箱内实体底的 10% 分位; 收盘跌破下沿 0.5 ATR 连续 >2 根才算离箱, 1~2 根就收回 = 假跌破(威科夫 Spring)", mech: "同上"}
  - {term: "均价线", def: "当天分时均价(成交额 ÷ 成交量)", mech: "3 秒盘口 / 分钟线 avg"}
  - {term: "区间位置", def: "现价在当日最低~最高之间的百分位(0 = 最低, 100 = 最高)", mech: "01 候选池\"日内位置%\"; 大小盘路径"}
  - {term: "冲高回落", def: "日内最高相对开盘 ≥ 阈值且收盘较最高回落 ≥ 阈值(阈值 = 本票近期日内振幅中位 × 0.4, 夹在 1%~4%)", mech: "pattern_scan 形态"}
  - {term: "探底回升", def: "日内最低相对开盘 ≤ −阈值且收盘较最低反弹 ≥ 阈值", mech: "pattern_scan 形态"}
  - {term: "单边上涨", def: "收盘相对开盘 ≥ 阈值且收在最高附近", mech: "pattern_scan 形态"}
  - {term: "单边下跌", def: "收盘相对开盘 ≤ −阈值且收在最低附近", mech: "pattern_scan 形态"}
  - {term: "窄幅震荡", def: "日内振幅 < 阈值", mech: "pattern_scan 形态"}
  - {term: "尾盘拉升", def: "14:20~14:45 的最低点之后到收盘的最大涨幅", mech: "pattern_scan 尾盘拉升"}
  - {term: "高开", def: "开盘相对昨收 ≥ +2%(转债同)", mech: "pattern_scan 事件 高开≥2%; ⚙️阈值可改"}
  - {term: "低开", def: "开盘相对昨收 ≤ −1%", mech: "pattern_scan 事件 低开≤−1%"}
  - {term: "近期规律", def: "近 10 天出现率 ≥70%(或 ≤20%)且回测有预测力的形态; 给的数是回测第二天出现率, 不是近期出现率", mech: "pattern_scan"}
  - {term: "反抽", def: "(10/25 用户定方向, 阈值 👤待你定) 恐慌盘卖完之后的第一波像样的上涨, 不是下跌途中的小反弹; 1 分钟线同时满足: ①MACD 红柱连续 ≥3 根没转绿(DIF > DEA 连续 3 分钟; MACD 柱 = 2×(DIF − DEA), DIF = EMA12 − EMA26, DEA = DIF 的 EMA9) ②RSI6(同花顺 / 通达信的 RSI1, 6 周期) > 80 ③价格 ≥ 分时均价 −0.2%; 三条都到才叫反抽。'第一波反抽卖' = 等反抽出现再卖, 不许在绿柱 / 均价线下方按固定价卖。**反抽定义只是'现在可以开始卖'的时机信号, 不是卖价**(10/25 用户): 卖价要先判断这次反抽是强是弱(会不会过均价 / 能到多高, 引用 E / Q 的统计), 按强弱分配卖量和价位, 不贪也不慌", mech: "10/23 回测: 百洋股份 09:33 @10.59(当天上午最高 10.61) · 北新路桥 09:33 @3.73(涨停价) · 海欣股份 10:59 @8.18(没到反抽前 09:36 按固定价卖在 8.16、当时 MACD 柱 −0.07 绿、价在均价 8.26 下方); 执行器条件单 rebound_sell 待做", ban: ["反弹卖"]}
  - {term: "跌停失败", def: "(10/25 用户) 盘中逼近 / 触及跌停但没封住、被拉回 = 有资金在维护; 次日第一波反抽是资金出逃的卖点(market-skill U4, 假设)", mech: "T−1 最低 ≤ 跌停价×1.02 且 收盘 ≥ 跌停价×1.03(主板); 和 跌停封死 / 撬板(封死后打开) 不是一回事"}
  - {term: "恐慌盘卖完", def: "(10/25 用户) 开盘后急跌那段抛压出尽: 价格不再创新低 + 1 分钟 MACD 由绿转红 —— 反抽的前提", mech: "同反抽 ①; 只有 ① 没有 ②③ = 只是止跌, 还不是反抽"}
  # ---------------- 大小盘 / 市况(market_path / 02) ----------------
  - {term: "大盘", def: "上证指数(sh000001)", ban: ["沪深300当大盘"]}
  - {term: "小盘", def: "国证2000(sz399303)"}
  - {term: "走强 / 走弱", def: "大小盘路径的结构状态: 开盘后首段 ≥ 阈值的上涨 / 下跌(阈值 上证 0.5% / 国证2000 0.8%)", mech: "market_path log"}
  - {term: "弱转强 / 强转弱", def: "上破前一个确认的波段高点(超出阈值 × 1/3) / 跌破前一个确认的波段低点; 没突破不改状态", mech: "market_path log"}
  - {term: "单边走强 / 单边走弱", def: "当天只有一次结构状态且没有翻转", mech: "market_path tag"}
  - {term: "大小盘差", def: "国证2000 涨跌幅 − 上证涨跌幅(个点)", mech: "market_path 背离"}
  - {term: "情绪阶段", def: "冰点 / 退潮 / 修复 / 分歧 / 主升(02 的 state 用这五个之一; 👤各阶段的机械判定还没定)", mech: "待定"}
  # ---------------- 竞价 ----------------
  - {term: "竞价撮合价", def: "集合竞价期间买一 = 卖一的虚拟成交价", mech: "book_snap 竞价段 b[0][0]"}
  - {term: "未匹配量", def: "竞价时撮合价上没成交的买(卖)单", mech: "买二量 / 卖二量"}
  - {term: "撤单假单", def: "09:18:30 之后某一方总挂单(匹配 + 未匹配)掉一半以上(09:20 前可撤单; 先挂大单抬 / 压价再撤)", mech: "auction_path ⚠疑似撤买单 / 撤卖单"}
  - {term: "竞价抢筹", def: "09:20 后撮合价比 09:20 抬高 ≥3% 且未匹配买 > 未匹配卖", mech: "harness.yaml 信号 S6"}
  # ---------------- 样例 / 统计 ----------------
  - {term: "正样例 / 负样例", def: "导师买入后第一次卖出盈亏 ≥ +1% / ≤ −1%(没卖过看买入日收盘 → 次日收盘, 负 ≤ −2%); 中间叫 平", mech: "case_label.label; 事件本体 trade 事件 label"}
  - {term: "今天的导师", def: "当天盘前选人入选(近 20 日收益 >0)且被你留下的导师", mech: "results/_live/<D>/selected_mentors.json active"}
  - {term: "样例导师", def: "当天没入选(近 20 日 ≤0 / 停更)的导师; 他们的逐笔照样是正负样例, 但不能当做法来源", mech: "selected_mentors.json ranked role"}
  - {term: "卖飞", def: "卖出后当天收盘比卖价高 ≥5%(持收增量 ≥ +5%)", mech: "cases.md 双尾样本库"}
  - {term: "逃顶", def: "卖出后当天收盘比卖价低 ≥5%(持收增量 ≤ −5%)", mech: "cases.md 双尾样本库"}
  - {term: "全分布", def: "n / 均值 / 中位 / P10 / P25 / P75 / P90 / 最差(带案例) / 最好(带案例)", mech: "scripts/lib/dist_full.py"}
  # ---------------- 系统 ----------------
  - {term: "模拟账本", def: "每条线自己那本 10 万元起步的账(执行器按 3 秒盘口撮合)", ban: ["影子账", "影子账本"]}
  - {term: "计划核销", def: "晚上把盘前计划的每个情景和实际走势逐条对", ban: ["影子账核销"]}
  - {term: "你的决策日志", def: "用户在微信回 照 / 偏 + 理由 的记录"}
  - {term: "候选池", def: "04 只能从里面选的票(上限 100 行)", mech: "chain_steps.pool"}
  # ---------------- 池子统一叫法(10/26 用户点头; 包含关系 持仓 ⊂ 信号池 ⊂ 盘口池, 点名池 / 必查池都并进信号池) ----------------
  - {term: "持仓", def: "用户实盘持仓 + 各线账上持仓", mech: "snapshots 最近持仓导出 + results/_live/<日>/live_*/state.json positions"}
  - {term: "点名池", def: "用户手动点名加的票, 只进不自动出, 用户说删才删(例 10/26 东百集团、国芳集团 + 6 只消费票)", mech: "scripts/temp/collect_book_extra.txt; 盘口池 T1 档 + 信号池"}

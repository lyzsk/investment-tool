# params.yaml — paper 策略参数(我们的策略, 非 persona; 2026-10-05 建, B6 小件)
# 消费方: run_taoge_chain.py(v06 仓位复检读 cap_single)/06 prompt 引用; 修改后无需改代码
# 立法源: docs/TODO.md §E「仓位参数」; 语料实证=regime 仓位制(桃哥 rules A1/A2)

# ---- 股票线(taoge) ----
stock:
  base_state: 地量防守          # 当前 regime 基准态(02 步判定偏离时按 regime 表调)
  max_total_position: 0.30      # 基准态总仓上限(3成); 市况转强放宽, 主跌强制极低仓
  cap_single: 0.15              # 单票上限(1.5成 nav)——驱动器 v06 机械复检口径
  min_cash_reserve: 0.40        # 现金留存下限(4成)
  regime:
    有主线: { max_total_position: 0.60, cap_single: 0.20 }
    无主线退潮: { max_total_position: 0.15, cap_single: 0.10 }
    普跌: { max_total_position: 0.05, cap_single: 0.05 }

# ---- 转债线(cb, A-cb 二期; 10/3 用户立法: 全仓单票+日内机械出) ----
cb:
  max_total_position: 1.00      # 全仓单票进
  take_profit_ladder: 0.03      # 梯子目标 +3%
  trail_sentinel: true          # 回落哨兵(高点回落 X% 即出, X 先用 1.5 观察再调)
  eod_force_exit: true          # 尾盘必走(不隔夜)
  # 妖债秒单打法(严牌类)=A-cb 疆界, C-cb 不越界(账本层由 plans source 区分)

# ---- 撮合仿真(matchter.mjs CONFIG 为准, 此处只做口径声明) ----
sim:
  price_cage: true              # 价格笼子 ±2%(连续竞价申报口径, 10/4 已落地 matcher)
  conservative_fill: true       # 触及≠成交, 买价须被现价击穿

# ---- 首跑期测试下限(2026-10-07 晚定稿: 分层制, Claude 裁) ----
# 目的: 防空仓白测; 效力=覆盖 stock.regime 总仓上限与 no_trade, 单票上限照旧
# 实证: tzzb 榜单头部 position_rate 0.93-1.0 满仓文化(尾部亏货也满仓→满仓非alpha, 选股才是)
test_floor:
  min_total_position: 0.40        # 真人拟人链(taoge/天哥/卢本圆): 参与度线, 保 regime 防守空间
  min_total_position_tzzb: 0.80   # tzzb 系(A-cb/A-tzzb 聚合): 满仓文化线

# ---- 动态仓位(2026-10-13 用户定: 按各导师真实持仓习惯学, 动态上限+动态下限, 替代上面固定的 15% 单票 / 40% 下限) ----
# 数据: downloads/tzzb/<导师>/day_positions.json 最近 window 个有记录的交易日(收盘口径, 剔逆回购); tzzb 每晚抓取后自动变 = 动态
# 单票上限 = 每日最大单票仓位的 cap_pct 分位(取整到 5%, 夹在 [cap_min, 1]); 总仓下限 = 每日收盘总仓的 floor_pct 分位(取整到 5%, ≤ floor_max)
# 下限为 0(导师常空仓收盘)时: 不设最低买入, 但"纯观望=违规"不变——不买也须给进场条件单
# 无账本的链(B站 UP/对照组)用 default_*; 土豆(转债 T+0, 收盘只剩逆回购, 收盘口径不适用)维持全仓 1.0 + test_floor.min_total_position_tzzb
dynamic_position:
  enabled: true
  window: 120
  cap_pct: 0.75
  floor_pct: 0.25
  cap_min: 0.25
  floor_max: 0.80
  default_cap: 0.25          # 用户 10/13: "一般 25% 开一仓"
  default_floor: 0.40

# ---- 盘中子链零 token 触发闸 A(2026-10-14 晚; 开关 chain_flags.txt CHAIN_SUBCHAIN_GATE; 消费方 run_taoge_chain.py gate_decide) ----
# 子链开跑前机械判断, 自上一个已跑 slot 以来下列都不成立 → 跳过本 slot(写 06 维持产物+run_meta skipped, 不调 claude):
#   a 本链账本有新成交/止损/挂单失效(撤单工具单的自失效不算)   b 持仓/挂单/0915 候选任一现价变动 ≥ min(price_move_pct, 近 amp_window 日振幅中位 × amp_half_factor)
#   c 上证/创业板指数变动 ≥ index_move_pt 个百分点             d 新加红电报命中持仓/候选票名或代码/02 方向关键词      e 本 slot ∈ force_slots(强制跑)
# 另: 无上一已跑 slot / 上一已跑 slot 没出 06 / 取数失败 → 一律照跑(fail-open)
subchain_gate:
  price_move_pct: 1.5
  amp_half_factor: 0.5
  amp_window: 30
  index_move_pt: 0.8
  force_slots: ["1000", "1455"]
  esc_rerun_max_elapsed_s: 900    # 修④: 子链 ESCALATE 后本 slot 重跑一次的时间预算(进程已跑秒数超过则不重跑直接 exit 3; Java 子链超时 40min)
